<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Tech Backdrop Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="100%" stop-color="#181B26" />
    </linearGradient>

    <!-- Vibrant AvishKar Signature Pink-Purple Cyber Gradient -->
    <linearGradient id="cyberPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A7A" />
      <stop offset="50%" stop-color="#E02567" />
      <stop offset="100%" stop-color="#B01550" />
    </linearGradient>

    <!-- Electric Cyan Electric Core Gradient -->
    <linearGradient id="electricCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Glowing Drop Shadow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#E02567" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#00F2FE" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Rounded Tech Badge Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#cyberPink)" stroke-width="6" stroke-opacity="0.4" />

  <!-- Outer Hexagonal Tech Grid Accent Ring -->
  <path d="M256 64 L416 160 L416 352 L256 448 L96 352 L96 160 Z" fill="none" stroke="url(#cyberPink)" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="12 8" />

  <!-- Bold Tech 'A' Monogram + Cyber Lightning Spike -->
  <g filter="url(#neonGlow)">
    <!-- Left Pillar of 'A' -->
    <path d="M148 400 L236 128 C242 110 270 110 276 128 L364 400 C368 412 356 424 342 420 L292 406 C284 404 278 396 276 388 L256 312 L212 312 L200 364 C198 374 190 380 180 380 L156 380 C144 380 138 390 148 400 Z" fill="url(#cyberPink)" />

    <!-- Crossbar Tech Notch -->
    <polygon points="218,290 294,290 256,170" fill="url(#bgGlow)" opacity="0.95" />

    <!-- High-Tech Sharp Cyber Lightning / Innovation Bolt Overlay -->
    <path d="M280 96 L216 248 L272 248 L224 416 L336 224 L276 224 Z" fill="url(#electricCyan)" />
  </g>

  <!-- Core Glowing Spark Dot -->
  <circle cx="256" cy="112" r="14" fill="#FFFFFF" filter="url(#neonGlow)" />
</svg>